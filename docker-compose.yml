services:
  weave-socket:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: weave-socket

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3001

    ports:
      - "3001:3001"

    networks:
      - platform

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  platform:
    external: true
